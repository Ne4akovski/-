<div class="gallery">
<figure>
<img src="images/w1.png" width="300" height="210" alt="1 факт">
<figcaption><strong>1 факт</strong> Капибары очень разговорчивы. Для общения между собой капибары используют разные звуки, они напоминают лай собаки, хрюканье, мурлыканье, свист, визжание.figcaption>
</figure>
<figure>
<img src="images/w11.jpg" width="300" height="210" alt="2 факт">
<figcaption><strong>2 факт</strong> Они на 100% безобидны. Предпочитают спокойную и тихую жизнь в своей стае, питаются исключительно растениями и травой. Капибары очень доверчивы и легко находят контакт с другими животными.</figcaption>
</figure>
<figure>
<img src="images/w12.jpg" width="300" height="210" alt="3 факт">
<figcaption><strong>3 факт</strong> У водосвинки острое обоняние. Это уникальная анатомическая особенность – способность самостоятельно двигать ноздрями. Это дает им возможность обоняния на 360 градусов, что позволяет им обнаруживать хищников, даже когда они находятся под землей или замаскированы растениями или водой.</figcaption>
</figure>
<figure>
<img src="images/w4.jpg" width="300" height="210" alt="4 факт">
<figcaption><strong>4 факт</strong>Они отличные пловцы. Несмотря на то, что их называют «свиньями» из-за их формы, тело водосвинки больше похоже на собаку, чем на свинью! У них есть перепончатые лапы, которые дают им уникальный плавательный ход. У них также есть небольшой хвост, который помогает им управлять, когда они плавают. Во время ныряния способны задерживать дыхание на 5 минут.figcaption>
</figure>
<figure>
<img src="images/w5.jpg" width="300" height="210" alt="5 факт">
<figcaption><strong>5 факт</strong> Капибары могут съедать около 70% своего веса каждый день, обычно это примерно 3,5 кг пищи.</figcaption>
</figure>
<figure>
<img src="images/w6.jpg" width="300" height="210" alt="6 факт">
<figcaption><strong>6 факт</strong> Период беременности капибары составляет 5 месяцев (130 — 150 дней). Самка рожает детенышей раз в год (при обилии корма изредка может принести потомство во второй раз) чаще всего в количестве 5-6 особей (отмечены случаи рождения от 1 до 8 детенышей). </figcaption>
</figure>
<figure>
<img src="images/w7.jpg" width="300" height="210" alt="7 факт">
<figcaption><strong>7 факт</strong> Капибары не потеют.</figcaption>
</figure>
<figure>
<img src="images/w8.jpg" width="300" height="210" alt="8 факт">
<figcaption><strong>8 факт</strong> Национальный банк Уругвая выпустил монеты, на которых изображена капибара. </figcaption>
</figure>
<figure>
<img src="images/w9.jpg" width="300" height="210" alt="9 факт">
<figcaption><strong>9 факт</strong> Как морские свинки и кролики, водосвинки поедают свой кал (копрофаги) для обогащения рациона витаминами группы В и лучшего усвоения клетчатки. </figcaption>
</figure>
<figure>
<img src="images/w10.jpg" width="300" height="210" alt="10 факт">
<figcaption><strong>10 факт</strong> Без частого увлажнения кожа капибар трескается. При длительном нахождении на солнце животное может получить ожог кожи. </figcaption>
</figure>
